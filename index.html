<style>
/* Layout: a product changelog. Each project is a shipped release: meta rail on the left (status, where, stack), the case on the right (problem, built, outcome, numbers). */
:root {
  --bg: #f3f4ef;
  --surface: #ffffff;
  --ink: #141821;
  --muted: #5a6170;
  --line: #d8dbd2;
  --accent: #2340d8;
  --accent-soft: #e3e7fb;
  --live: #1d7f47;
  --live-soft: #dcefe3;
  --warn: #9a5a00;
  --warn-soft: #f6ead6;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Hanken Grotesk", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1217; --surface: #161a21; --ink: #e8eaef; --muted: #9aa1ae; --line: #2a2f39;
    --accent: #8a9dff; --accent-soft: #1e2648; --live: #5bc98a; --live-soft: #15301f;
    --warn: #e0a54c; --warn-soft: #33270f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1217; --surface: #161a21; --ink: #e8eaef; --muted: #9aa1ae; --line: #2a2f39;
  --accent: #8a9dff; --accent-soft: #1e2648; --live: #5bc98a; --live-soft: #15301f;
  --warn: #e0a54c; --warn-soft: #33270f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.55; }
a { color: var(--accent); text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.label { font-family: var(--mono); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

/* Hero */
.hero { padding-block: 56px 40px; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 48px; align-items: end; border-bottom: 1px solid var(--line); }
.hero h1 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 6.4vw, 76px); line-height: .95; letter-spacing: -.025em; margin: 12px 0 20px; text-wrap: balance; }
.hero .headline { font-family: var(--display); font-weight: 500; font-size: clamp(20px, 2.4vw, 26px); line-height: 1.25; margin: 0 0 16px; max-width: 30ch; text-wrap: balance; }
.hero .intro { color: var(--muted); max-width: 58ch; margin: 0; }
.contact { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 24px; align-items: center; }
.contact a, .contact button { font-family: var(--mono); font-size: 14px; }
.email { display: inline-flex; gap: 8px; align-items: center; }
.email code { font-family: var(--mono); font-size: 14px; user-select: all; }
.copy { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
.copy:hover { border-color: var(--accent); }
.ledger { display: grid; gap: 0; border-top: 2px solid var(--ink); }
.ledger div { display: grid; grid-template-columns: 9.5ch minmax(0, 1fr); gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); align-items: baseline; }
.ledger b { font-family: var(--display); font-weight: 700; font-size: 22px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.ledger span { color: var(--muted); font-size: 14px; line-height: 1.4; }

/* Section heads */
.sec { padding-block: 44px 8px; }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
.sec-head h2 { font-family: var(--display); font-weight: 700; font-size: 30px; letter-spacing: -.015em; margin: 0; }

/* Projects */
.proj { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 32px; padding-block: 32px; border-top: 1px solid var(--line); }
.rail { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.status { display: inline-flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 12px; font-weight: 500; padding: 4px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.status.live { background: var(--live-soft); color: var(--live); }
.status.analysis { background: var(--warn-soft); color: var(--warn); }
.where { font-size: 14px; color: var(--ink); font-weight: 600; }
.year { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stack { display: flex; flex-wrap: wrap; gap: 6px; }
.stack span { font-family: var(--mono); font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; }
.case h3 { font-family: var(--display); font-weight: 700; font-size: clamp(24px, 3vw, 32px); line-height: 1.1; letter-spacing: -.02em; margin: 0 0 6px; text-wrap: balance; }
.tagline { color: var(--muted); margin: 0 0 20px; font-size: 17px; }
.pbo { display: grid; gap: 14px; margin: 0; max-width: 68ch; }
.pbo div { display: grid; grid-template-columns: 8ch minmax(0, 1fr); gap: 14px; }
.pbo dt { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding-top: 3px; }
.pbo dd { margin: 0; }
.nums { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 22px 0 0; padding: 16px 0 0; border-top: 1px dashed var(--line); }
.nums div { display: flex; flex-direction: column; min-width: 0; }
.nums b { font-family: var(--display); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
.nums span { font-size: 13px; color: var(--muted); max-width: 22ch; line-height: 1.35; }
.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.links a { font-family: var(--mono); font-size: 13px; text-decoration: none; border: 1px solid var(--accent); padding: 6px 12px; border-radius: 6px; }
.links a:hover { background: var(--accent); color: var(--bg); }
.links a::after { content: " ↗"; }
.note { font-size: 13px; color: var(--muted); margin-top: 20px; font-style: italic; }

/* Experience */
.timeline { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 40px; margin-top: 12px; }
.timeline h4 { grid-column: 1 / -1; margin: 22px 0 4px; font-family: var(--mono); font-weight: 500; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.role { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.role strong { font-weight: 600; }
.role .org { color: var(--muted); font-size: 14px; grid-column: 1; }
.role .when { font-family: var(--mono); font-size: 12.5px; color: var(--muted); grid-row: 1; grid-column: 2; font-variant-numeric: tabular-nums; white-space: nowrap; }
footer { padding-block: 48px 64px; color: var(--muted); font-size: 14px; }

/* Currently building */
.wip-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; padding-top: 16px; border-top: 1px solid var(--line); }
.wip { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 22px; min-width: 0; }
.wip h3 { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: -.015em; margin: 12px 0 6px; }
.wip .tagline { font-size: 15px; margin-bottom: 14px; }
.wip .pbo div { grid-template-columns: 6ch minmax(0, 1fr); }
.wip .pbo dd { font-size: 15px; }
.status.wip-tag { background: var(--warn-soft); color: var(--warn); }

@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 32px; padding-block: 36px 32px; }
  .proj { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .rail { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .timeline { grid-template-columns: minmax(0, 1fr); }
  .pbo div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .wip-grid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .proj { animation: rise .5s ease both; }
  @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
}
</style>

<script id="app-js">
(function () {
  var state;
  try { state = JSON.parse(document.getElementById("portfolio-data").textContent); } catch (e) { state = { profile: {}, projects: [] }; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { u = String(u || "").trim(); return /^https?:\/\//i.test(u) ? u : ""; }
  function linksOf(p) {
    return (p.links || []).map(function (l) { var u = safeUrl(l.url); return u ? '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(l.label || "Link") + "</a>" : ""; }).join("");
  }
  function stackOf(p) { return (p.stack || []).filter(Boolean).map(function (s) { return "<span>" + esc(s) + "</span>"; }).join(""); }

  function renderShipped(p) {
    var kind = p.statusKind === "live" ? "live" : (p.statusKind === "analysis" ? "analysis" : "");
    var metrics = (p.metrics || []).filter(function (m) { return m && m.v; }).map(function (m) { return "<div><b>" + esc(m.v) + "</b><span>" + esc(m.l) + "</span></div>"; }).join("");
    var rows = [["Problem", p.problem], ["Built", p.built], ["Outcome", p.outcome]].filter(function (r) { return r[1]; })
      .map(function (r) { return "<div><dt>" + r[0] + "</dt><dd>" + esc(r[1]) + "</dd></div>"; }).join("");
    var links = linksOf(p), stack = stackOf(p);
    return '<article class="proj" id="' + esc(p.id) + '"><div class="rail">' +
      (p.status ? '<span class="status ' + kind + '">' + esc(p.status) + "</span>" : "") +
      (p.where ? '<span class="where">' + esc(p.where) + "</span>" : "") +
      (p.year ? '<span class="year">' + esc(p.year) + "</span>" : "") +
      (stack ? '<div class="stack">' + stack + "</div>" : "") + "</div>" +
      '<div class="case"><h3>' + esc(p.title) + "</h3>" +
      (p.tagline ? '<p class="tagline">' + esc(p.tagline) + "</p>" : "") +
      (rows ? '<dl class="pbo">' + rows + "</dl>" : "") +
      (metrics ? '<div class="nums">' + metrics + "</div>" : "") +
      (links ? '<div class="links">' + links + "</div>" : "") +
      (p.note ? '<p class="note">' + esc(p.note) + "</p>" : "") + "</div></article>";
  }

  function renderBuilding(p) {
    var done = p.outcome ? p.built + " " + p.outcome : p.built;
    var links = linksOf(p), stack = stackOf(p);
    return '<article class="wip" id="' + esc(p.id) + '">' +
      '<span class="status wip-tag">In progress</span>' +
      "<h3>" + esc(p.title) + "</h3>" +
      (p.tagline ? '<p class="tagline">' + esc(p.tagline) + "</p>" : "") +
      '<dl class="pbo"><div><dt>Works</dt><dd>' + esc(done) + "</dd></div>" +
      (p.next ? "<div><dt>Next</dt><dd>" + esc((function (t) { return t.charAt(0).toUpperCase() + t.slice(1); })(p.next.replace(/^Next:\s*/, ""))) + "</dd></div>" : "") + "</dl>" +
      (stack ? '<div class="stack" style="margin-top:16px">' + stack + "</div>" : "") +
      (links ? '<div class="links">' + links + "</div>" : "") +
      (p.note ? '<p class="note">' + esc(p.note) + "</p>" : "") + "</article>";
  }

  function renderRoles(list) {
    return (list || []).map(function (r) { return '<div class="role"><strong>' + esc(r.role) + '</strong><span class="when">' + esc(r.when) + '</span><span class="org">' + esc(r.org) + "</span></div>"; }).join("");
  }

  var pr = state.profile || {};
  var all = state.projects || [];
  var shipped = all.filter(function (p) { return p.group !== "building"; });
  var building = all.filter(function (p) { return p.group === "building"; });
  var ledger = (pr.ledger || []).map(function (x) { return "<div><b>" + esc(x.v) + "</b><span>" + esc(x.l) + "</span></div>"; }).join("");
  document.getElementById("app").innerHTML =
    '<header class="wrap"><div class="hero"><div>' +
      '<span class="label">' + esc(pr.role) + "</span><h1>" + esc(pr.name) + "</h1>" +
      '<p class="headline">' + esc(pr.headline) + '</p><p class="intro">' + esc(pr.intro) + "</p>" +
      '<div class="contact"><span class="email"><code id="email-text">' + esc(pr.email) + '</code><button class="copy" id="copy-email" type="button">Copy</button></span>' +
        (safeUrl(pr.linkedin) ? '<a href="' + esc(pr.linkedin) + '" target="_blank" rel="noopener">LinkedIn ↗</a>' : "") +
        (safeUrl(pr.github) ? '<a href="' + esc(pr.github) + '" target="_blank" rel="noopener">GitHub ↗</a>' : "") +
      "</div></div>" +
      '<div class="ledger" aria-label="Track record">' + ledger + "</div></div></header>" +
    '<main class="wrap">' +
      '<section class="sec" aria-labelledby="work-h"><div class="sec-head"><h2 id="work-h">Shipped</h2><span class="label">' + shipped.length + " projects</span></div>" +
        shipped.map(renderShipped).join("") + "</section>" +
      (building.length ? '<section class="sec" aria-labelledby="wip-h"><div class="sec-head"><h2 id="wip-h">Currently building</h2><span class="label">' + building.length + " in progress</span></div>" +
        '<div class="wip-grid">' + building.map(renderBuilding).join("") + "</div></section>" : "") +
      '<section class="sec" aria-labelledby="exp-h"><div class="sec-head"><h2 id="exp-h">Experience</h2></div>' +
        '<div class="timeline"><h4>Work</h4>' + renderRoles(pr.experience) + "<h4>Education</h4>" + renderRoles(pr.education) + "</div></section>" +
    "</main>" +
    '<footer class="wrap">' + esc(pr.name) + " · Pune, India</footer>";

  document.getElementById("copy-email").addEventListener("click", function () {
    var t = this, txt = pr.email || "";
    var done = function () { t.textContent = "Copied"; setTimeout(function () { t.textContent = "Copy"; }, 1600); };
    var fallback = function () { var r = document.createRange(); r.selectNodeContents(document.getElementById("email-text")); var s = getSelection(); s.removeAllRanges(); s.addRange(r); t.textContent = "Selected"; };
    try { navigator.clipboard.writeText(txt).then(done, fallback); } catch (er) { fallback(); }
  });
})();
</script>

</body>
</html>
